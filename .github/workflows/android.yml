name: Projeto Super original - gerar APK de teste identificável

on:
  workflow_dispatch:
  push:
    branches:
      - android-native

permissions:
  contents: read

concurrency:
  group: projeto-super-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK do Projeto Super original
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar fontes da variante release (sem gerar APK)
        run: gradle :app:compileReleaseKotlin

      - name: Gerar APK instalável de teste do app original
        run: gradle :app:assembleDebug

      - name: Identificar e calcular hash do APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          printf 'Projeto: Projeto Super original\\nBranch: android-native\\nCommit: %s\\nPackage: com.projetosuper.lab\\nBuild: debug para teste; assinatura pode não corresponder ao APK instalado\\n' "$GITHUB_SHA" > app/build/outputs/apk/debug/IDENTIFICACAO.txt

      - name: Publicar APK e identificação
        uses: actions/upload-artifact@v4
        with:
          name: projeto-super-original-teste
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/IDENTIFICACAO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validar JavaScript do dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("dashboard.html").read_text(encoding="utf-8")
          start_tag = '<script type="module">'
          start = html.index(start_tag) + len(start_tag)
          end = html.index('</script>', start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/dashboard.mjs
