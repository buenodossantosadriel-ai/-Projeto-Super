name: Compilar Projeto Super original

on:
  workflow_dispatch:
  push:
    branches:
      - android-native

permissions:
  contents: read

concurrency:
  group: projeto-super-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android original
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK original
        run: gradle :app:assembleDebug

      - name: Validar JavaScript do dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("dashboard.html").read_text(encoding="utf-8")
          start_tag = '<script type="module">'
          start = html.index(start_tag) + len(start_tag)
          end = html.index('</script>', start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/dashboard.mjs

      - name: Disponibilizar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: projeto-super-original-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
