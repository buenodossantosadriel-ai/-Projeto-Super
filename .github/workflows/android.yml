name: Projeto Super original - gerar APK de teste identificável

on:
  workflow_dispatch:
  push:
    branches:
      - android-native

permissions:
  contents: read

concurrency:
  group: projeto-super-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK do Projeto Super original
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar captura JPEG e controle pela Acessibilidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/projetosuper/lab/MainActivity.kt").read_text()
          all_kotlin = "\\n".join(path.read_text() for path in Path("app/src/main").rglob("*.kt"))
          capture = Path("app/src/main/java/com/projetosuper/lab/ScreenCaptureService.kt").read_text()
          control = Path("app/src/main/java/com/projetosuper/lab/RemoteControlAccessibilityService.kt").read_text()
          launcher = Path("app/src/main/java/com/projetosuper/lab/RemoteDisplayLauncher.kt").read_text()
          api = Path("app/src/main/java/com/projetosuper/lab/ControlApi.kt").read_text()
          accessibility_xml = Path("app/src/main/res/xml/remote_control_accessibility.xml").read_text()
          dashboard = Path("dashboard.html").read_text()
          backend = Path("supabase/functions/projeto-super-controle/index.ts").read_text()
          assert "MediaProjection" not in all_kotlin
          assert "getMediaProjection" not in all_kotlin
          assert "createScreenCaptureIntent" not in all_kotlin
          assert "createVirtualDisplay(" not in all_kotlin
          assert "takeScreenshot(" in control
          assert "Bitmap.wrapHardwareBuffer" in control
          assert "Display.DEFAULT_DISPLAY" in control
          assert 'android:canTakeScreenshot="true"' in accessibility_xml
          assert "ACTION_ACCESSIBILITY_SETTINGS" in main
          assert "accessibilitySettingsOpenedForThisLaunch" in main
          assert "isAccessibilityServiceEnabled(context)" in main
          assert "FEATURE_ACTIVITIES_ON_SECONDARY_DISPLAYS" not in all_kotlin
          assert "setDisplayId(" not in control
          assert "swipeNormalized" in control
          assert 'action.startsWith("swipe:")' in control
          assert "suspendCancellableCoroutine" in control
          assert "onCompleted" in control and "onCancelled" in control
          assert "remote_target_package" in control
          assert "selectedAppFocused" in control
          assert "if (!selectedAppFocused) return@withContext false" in control
          assert "rootInActiveWindow" not in control
          assert "performGlobalAction(GLOBAL_ACTION_BACK)" in control
          assert "RemoteDisplayLauncher.start" in control
          assert "ControlApi.poll(this, \"accessibility\")" in control
          assert "ControlApi.uploadFrame" in capture
          assert 'ControlApi.poll(this@ScreenCaptureService, "screen")' in capture
          assert "remoteControlReady()" in capture
          assert 'getBoolean("app_control_authorized"' in capture
          assert '.remove("remote_target_package")' in capture
          assert "image/jpeg" in api
          assert 'ControlApi.poll(context, "activity")' in main
          audio = Path("app/src/main/java/com/projetosuper/lab/AudioCaptureService.kt").read_text()
          camera = Path("app/src/main/java/com/projetosuper/lab/CameraCaptureService.kt").read_text()
          assert 'ControlApi.poll(this@AudioCaptureService, "audio")' in audio
          assert 'ControlApi.poll(this@CameraCaptureService, "camera")' in camera
          assert "stop_session" not in main
          assert "remote_home" not in backend + dashboard + all_kotlin
          assert "WebRTC" not in all_kotlin + dashboard
          assert 'd.active_session?.session_type==="screen_share"' in dashboard
          assert "sendText.disabled=!canRemote" in dashboard
          assert 'const isSwipe =' in backend
          assert 'requestedAction = String(body.control || "")' in backend
          assert "isRemoteNavigation || isTap || isSwipe || isTypeText" in backend
          assert "isVirtualDisplayCommand" not in backend
          assert 'const allowedConsumers = ["activity", "accessibility", "screen", "audio", "camera"]' in backend
          assert 'expectedConsumer = sessionType === "screen_share" ? "screen"' in backend
          assert 'file.type !== "image/jpeg"' in backend
          assert '"image/png"' not in backend
          assert "pendingCleanupError" in backend
          print("Captura JPEG por Acessibilidade, comandos remotos e contrato do dashboard verificados.")
          PY

      - name: Compilar fontes da variante release (sem gerar APK)
        run: gradle :app:compileReleaseKotlin

      - name: Gerar APK instalável de teste do app original
        run: gradle :app:assembleDebug

      - name: Identificar e calcular hash do APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          printf 'Projeto: Projeto Super original\\nBranch: android-native\\nCommit: %s\\nPackage: com.projetosuper.lab\\nVersão: 0.3.0 (3)\\nBuild: debug para teste; assinatura pode não corresponder ao APK instalado\\n' "$GITHUB_SHA" > app/build/outputs/apk/debug/IDENTIFICACAO.txt

      - name: Publicar APK e identificação
        uses: actions/upload-artifact@v4
        with:
          name: projeto-super-original-teste
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/IDENTIFICACAO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validar JavaScript do dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("dashboard.html").read_text(encoding="utf-8")
          start_tag = '<script type="module">'
          start = html.index(start_tag) + len(start_tag)
          end = html.index('</script>', start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/dashboard.mjs
